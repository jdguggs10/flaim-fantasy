name: Snapshot tools

# Refreshes tools/ from the live Flaim MCP server: tools/list and the server
# instructions from initialize. Runs daily as drift detection, and on demand.
# No secret is needed; the endpoint answers these calls without sign-in.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      allow_tool_removal:
        description: Accept a lower tool count (a tool was really removed)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Fetch live tool definitions
        env:
          ALLOW_TOOL_REMOVAL: ${{ inputs.allow_tool_removal && 'true' || 'false' }}
        run: python3 scripts/snapshot_tools.py tools

      # A mirror sync can land while this runs. It never touches tools/, so
      # rebasing onto it is clean.
      - name: Commit if the wording changed
        run: |
          if [ -z "$(git status --porcelain -- tools)" ]; then
            echo "No change in tools/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools
          git commit -m "Update tool snapshot"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} was rejected; rebasing onto the new main."
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
